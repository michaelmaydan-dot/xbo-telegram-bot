name: XBO Top 5 Tokens Bot

on:
  # Расписание: Пн, Ср, Пт в 11:45 UTC
  # Если вам нужно 11:45 по Киеву (UTC+3), ставьте 08:45 UTC
  schedule:
    - cron: '45 8 * * 1,3,5'

  # Возможность запустить вручную (кнопка в GitHub)
  workflow_dispatch:

jobs:
  post-top-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
